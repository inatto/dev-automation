[audio]
sample_rate = 16000
block_seconds = 0.25
utterance_max_seconds = 3.5
silence_to_finish_seconds = 0.65
speech_rms_threshold = 0.012

[recognition]
model = "medium"
language = "pt"
compute_type = "float16"
gpu_fallback_compute_type = "int8_float16"
cpu_compute_type = "int8"
device = "cuda"
allow_cpu_fallback = false
minimum_similarity = 0.82
cooldown_seconds = 0.90

[logging]
enabled = true
directory = "logs"

[action]
backend = "auto"
workspace_step_delay = 0.07

[ui]
max_history = 200
